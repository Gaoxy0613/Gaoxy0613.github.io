<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 gxy love cpr 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1, #f06292);
            background-size: 400% 400%;
            animation: gradientMove 8s ease-in-out infinite;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 20px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 60px 60px 60px 60px;
            padding: 50px 40px 40px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(233, 30, 99, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* 飘浮的爱心粒子 */
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .heart-float {
            position: absolute;
            font-size: 24px;
            opacity: 0.3;
            animation: floatUp 12s linear infinite;
        }

        .heart-float:nth-child(1) { left: 5%; animation-delay: 0s; font-size: 30px; }
        .heart-float:nth-child(2) { left: 15%; animation-delay: 2s; font-size: 20px; }
        .heart-float:nth-child(3) { left: 30%; animation-delay: 4s; font-size: 36px; }
        .heart-float:nth-child(4) { left: 50%; animation-delay: 1s; font-size: 18px; }
        .heart-float:nth-child(5) { left: 65%; animation-delay: 3.5s; font-size: 28px; }
        .heart-float:nth-child(6) { left: 78%; animation-delay: 5s; font-size: 22px; }
        .heart-float:nth-child(7) { left: 90%; animation-delay: 2.5s; font-size: 32px; }
        .heart-float:nth-child(8) { left: 42%; animation-delay: 6s; font-size: 26px; }
        .heart-float:nth-child(9) { left: 22%; animation-delay: 7s; font-size: 16px; }
        .heart-float:nth-child(10) { left: 72%; animation-delay: 4.5s; font-size: 34px; }

        @keyframes floatUp {
            0% {
                transform: translateY(100%) rotate(0deg) scale(1);
                opacity: 0.2;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg) scale(1.5);
                opacity: 0;
            }
        }

        .big-heart {
            font-size: 64px;
            display: block;
            margin-bottom: 8px;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.2); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        /* ===== 新增：相爱天数 ===== */
        .days-counter {
            font-size: 28px;
            color: #4a0a2a;
            background: rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            border-radius: 60px;
            display: inline-block;
            margin-bottom: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-weight: bold;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .days-counter .number {
            font-size: 40px;
            color: #e91e63;
            font-family: 'Courier New', monospace;
        }

        .days-counter .label {
            font-size: 18px;
            color: #880e4f;
        }

        .title {
            font-size: 34px;
            font-weight: bold;
            color: #880e4f;
            text-shadow: 0 2px 20px rgba(233, 30, 99, 0.3);
            letter-spacing: 4px;
            position: relative;
            z-index: 1;
            margin-top: 4px;
        }

        .title .heart-icon {
            color: #e91e63;
        }

        .time-wrapper {
            margin: 24px 0 18px 0;
            padding: 18px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 1;
        }

        .time-label {
            font-size: 15px;
            color: #ad1457;
            letter-spacing: 6px;
            opacity: 0.8;
            margin-bottom: 6px;
            font-weight: bold;
        }

        #clock {
            font-size: 48px;
            font-weight: bold;
            color: #4a0a2a;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(233, 30, 99, 0.15);
        }

        #clock .seconds {
            font-size: 32px;
            color: #e91e63;
        }

        .sub-message {
            font-size: 20px;
            color: #6a1b3a;
            margin-top: 14px;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
            font-style: italic;
        }

        .sub-message .sparkle {
            display: inline-block;
            animation: sparkle 1.8s ease-in-out infinite;
        }

        .sub-message .sparkle:nth-child(2) { animation-delay: 0.6s; }
        .sub-message .sparkle:nth-child(3) { animation-delay: 1.2s; }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
        }

        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: rgba(136, 14, 79, 0.5);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .card {
                padding: 30px 18px 22px 18px;
                border-radius: 40px;
            }
            .title {
                font-size: 24px;
            }
            .big-heart {
                font-size: 48px;
            }
            .days-counter {
                font-size: 20px;
                padding: 10px 18px;
            }
            .days-counter .number {
                font-size: 30px;
            }
            #clock {
                font-size: 34px;
            }
            #clock .seconds {
                font-size: 24px;
            }
            .sub-message {
                font-size: 16px;
            }
            .heart-float {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 飘浮爱心背景 -->
        <div class="hearts">
            <span class="heart-float">💗</span>
            <span class="heart-float">❤️</span>
            <span class="heart-float">💖</span>
            <span class="heart-float">💕</span>
            <span class="heart-float">💗</span>
            <span class="heart-float">❤️</span>
            <span class="heart-float">💖</span>
            <span class="heart-float">💕</span>
            <span class="heart-float">💗</span>
            <span class="heart-float">❤️</span>
        </div>

        <!-- 主内容 -->
        <span class="big-heart">💖</span>

        <!-- ===== 新增：相爱天数显示 ===== -->
        <div class="days-counter">
            💕 <span class="number" id="daysCount">0</span> <span class="label">天</span> 💕
        </div>

        <div class="title">
            <span class="heart-icon">💕</span> gxy love cpr <span class="heart-icon">💕</span>
        </div>

        <div class="time-wrapper">
            <div class="time-label">✦ 此刻的心跳 ✦</div>
            <div id="clock">
                <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds" class="seconds">00</span>
            </div>
        </div>

        <div class="sub-message">
            <span class="sparkle">✨</span>
            每一秒都是我爱你
            <span class="sparkle">✨</span>
        </div>

        <div class="footer-note">♥  forever & always  ♥</div>
    </div>

    <script>
        // ===== 相爱日期：2019年11月10日 =====
        const loveStart = new Date(2019, 10, 10); // 注意：月份从0开始，10代表11月

        function updateClockAndDays() {
            const now = new Date();

            // ---- 更新时钟 ----
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('hours').textContent = h;
            document.getElementById('minutes').textContent = m;
            document.getElementById('seconds').textContent = s;

            // ---- 更新相爱天数 ----
            const diffMs = now - loveStart; // 相差的毫秒数
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24)); // 换算成天数
            document.getElementById('daysCount').textContent = diffDays;
        }

        updateClockAndDays();
        setInterval(updateClockAndDays, 1000);
    </script>

</body>
</html>
